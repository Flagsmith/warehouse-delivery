[project]
name = "warehouse-delivery"
version = "0.1.0"
description = "Delivers Flagsmith experiment events from Kafka to customers' own data warehouses"
requires-python = ">=3.14, <3.15"
dependencies = [
    "confluent-kafka>=2.6,<3",
    "clickhouse-connect>=1.6,<2",
    "urllib3>=2,<3",
    "redis>=5.2,<7",
    "cryptography>=43,<47",
    "structlog>=24.4,<26",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-mock>=3.14,<4",
    "pytest-structlog>=1.1,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.9.7,<0.15",
    "mypy>=1.15,<2",
    "types-confluent-kafka>=1.3,<2",
]

[project.scripts]
warehouse-delivery = "warehouse_delivery.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["warehouse_delivery"]

[tool.uv]
required-version = ">=0.11.18"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:warnings", "--import-mode=importlib"]
markers = ["integration: needs Redpanda, ClickHouse or Redis running locally"]

[tool.mypy]
strict = true
files = ["warehouse_delivery", "tests"]
