name: Deploy to Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-push:
    uses: ./.github/workflows/.reusable-build-push-ecr.yml
    with:
      environment: production
    secrets: inherit
